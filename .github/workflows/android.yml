name: Offline Football Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Confirm project files
        run: |
          test -f project.godot
          test -f scripts/main.gd
          echo "Godot project files found."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all project source tests
        run: |
          set -e
          for test_file in tests_stage*.py; do
            echo "Running $test_file"
            python "$test_file"
          done
          echo "ALL 14 SOURCE TEST SUITES PASSED"