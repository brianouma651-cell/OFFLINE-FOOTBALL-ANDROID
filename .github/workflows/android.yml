name: Build Offline Football Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Export Android debug APK (Godot 4.3)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Download Godot 4.3 and Android export templates
        shell: bash
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          GODOT_BIN="$(find "$HOME/godot" -maxdepth 2 -type f -name 'Godot_v4.3-stable_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -o "$HOME/godot/templates.tpz"
          mkdir -p "$HOME/godot/templates"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp -a "$HOME/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Run source checks
        run: |
          for test_file in tests_stage*.py; do
            python3 "$test_file"
          done

      - name: Import Godot project
        run: "$GODOT_BIN" --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/OfflineFootball-debug.apk
          test -s build/OfflineFootball-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Offline-Football-Android-debug-APK
          path: build/OfflineFootball-debug.apk
          if-no-files-found: error
          retention-days: 14