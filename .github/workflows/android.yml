name: Offline Football Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Confirm project files
        run: |
          test -f project.godot
          test -f scripts/main.gd
          echo "Godot project files found."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all project source tests
        run: |
          set -e
          for test_file in tests_stage*.py; do
            echo "Running $test_file"
            python "$test_file"
          done
          echo "ALL SOURCE TEST SUITES PASSED"

      - name: Download Godot 4.3
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --version

      - name: Import Godot project
        run: |
          set -e
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit
          echo "GODOT PROJECT IMPORT COMPLETED"